<header class="top"><div class="brand"><h1>That’s what linear is all about</h1><div class="byline">Designed by Luis Novoa and built using Codex. For educational purposes</div></div><div class="actions"><button class="btn secondary" id="exampleBtn">Try an example</button><button class="btn secondary" id="resetBtn">Start over</button></div></header>
<div class="stage-label" id="stageLabel">Step 1 · Variables</div><div class="progress" id="progress" aria-label="Lesson progress"></div>
<div class="layout"><section class="card lesson" id="lesson" aria-live="polite"></section>
<aside class="card graph-card"><div class="graph-head"><h2>Your coordinate plane</h2><span class="readout" id="readout">Move over the graph</span></div><div class="graph-wrap"><svg id="graph" role="img" aria-label="Interactive coordinate plane"></svg></div><div class="constraints" id="constraintList"></div></aside></div>
</main>
<script>
"use strict";
const EPS=1e-8, COLORS=['#315bea','#e05f75','#149b78','#9a58c7','#d88414','#1877a8'];
const S={step:'variables',vars:['x','y'],nonneg:null,constraints:[],draft:null,current:null,editing:null,tries:{},range:{xmin:-10,xmax:10,ymin:-10,ymax:10},point:null,final:false};
const $=s=>document.querySelector(s), lesson=$('#lesson'), svg=$('#graph');
const fmt=n=>{if(Math.abs(n)<EPS)n=0; let r=Math.round(n*1000)/1000; return Number.isInteger(r)?String(r):String(r)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prettyMath=s=>esc(String(s).replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/\*/g,'×').replace(/\s*([+−=≤≥×])\s*/g,' $1 ').replace(/\s+/g,' ').trim());
function tokenizeExpression(src,names=S.vars){let s=src.replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').trim(),out=[],i=0;const aliases=[[names[0],'x'],[names[1],'y'],['x','x'],['y','y']].sort((a,b)=>b[0].length-a[0].length);while(i<s.length){if(/\s/.test(s[i])){i++;continue}let m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(m){out.push({t:'num',v:+m[0]});i+=m[0].length;continue}let found=aliases.find(a=>s.slice(i,i+a[0].length).toLowerCase()===a[0].toLowerCase()&&!/[A-Za-z]/.test(s[i+a[0].length]||''));if(found){out.push({t:'var',v:found[1]});i+=found[0].length;continue}m=s.slice(i).match(/^[A-Za-z_][A-Za-z_0-9]*/);if(m){out.push({t:'fn',v:m[0]});i+=m[0].length;continue}if('+-*/^()'.includes(s[i])){out.push({t:s[i],v:s[i++]});continue}throw Error('I could not read “'+s[i]+'”. Use numbers, your variable names, and + − × ÷ with parentheses.')}return insertImplicit(out)}
function insertImplicit(t){let o=[];for(let i=0;i<t.length;i++){let a=t[i-1],b=t[i];if(a&&['num','var',')'].includes(a.t)&&['var','num','fn','('].includes(b.t))o.push({t:'*',v:'*'});o.push(b)}return o}
function parseExpression(src){let t=tokenizeExpression(src),i=0;function primary(){let z=t[i++];if(!z)throw Error('The expression ends too soon.');if(z.t==='num')return {k:'n',v:z.v};if(z.t==='var')return {k:'v',v:z.v};if(z.t==='fn')throw Error('This uses the nonlinear function “'+z.v+'”. Variables inside functions are not linear.');if(z.t==='('){let a=add();if(t[i++]?.t!==')')throw Error('A closing parenthesis is missing.');return a}if(z.t==='+'||z.t==='-')return {k:'u',op:z.t,a:primary()};throw Error('I expected a number, variable, or parenthesis.')}function pow(){let a=primary();if(t[i]?.t==='^'){i++;a={k:'b',op:'^',a,b:primary()}}return a}function mul(){let a=pow();while(t[i]&&['*','/'].includes(t[i].t)){let op=t[i++].t;a={k:'b',op,a,b:pow()}}return a}function add(){let a=mul();while(t[i]&&['+','-'].includes(t[i].t)){let op=t[i++].t;a={k:'b',op,a,b:mul()}}return a}let a=add();if(i<t.length)throw Error('I could not interpret the full expression.');return a}
function normalizeLinearExpression(node){if(node.k==='n')return {a:0,b:0,c:node.v};if(node.k==='v')return {a:node.v==='x'?1:0,b:node.v==='y'?1:0,c:0};if(node.k==='u'){let q=normalizeLinearExpression(node.a),s=node.op==='-'?-1:1;return {a:s*q.a,b:s*q.b,c:s*q.c}}let l=normalizeLinearExpression(node.a),r=normalizeLinearExpression(node.b);if(node.op==='+'||node.op==='-'){let s=node.op==='+'?1:-1;return {a:l.a+s*r.a,b:l.b+s*r.b,c:l.c+s*r.c}}let lc=Math.abs(l.a)<EPS&&Math.abs(l.b)<EPS,rc=Math.abs(r.a)<EPS&&Math.abs(r.b)<EPS;if(node.op==='*'){if(!lc&&!rc)throw Error('Two variable-containing expressions are multiplied. In a linear expression, numbers may multiply variables—but variables do not multiply variables.');let k=lc?l.c:r.c,q=lc?r:l;return {a:k*q.a,b:k*q.b,c:k*q.c}}if(node.op==='/'){if(!rc)throw Error('A variable appears in the denominator. Linear expressions only divide by nonzero constants.');if(Math.abs(r.c)<EPS)throw Error('Division by zero is not defined.');return {a:l.a/r.c,b:l.b/r.c,c:l.c/r.c}}if(node.op==='^'){if(!rc||Math.abs(r.c-1)>EPS)throw Error('A variable is raised to a power. In a linear expression, each variable appears only to the first power.');return l}throw Error('That operation is nonlinear.')}
function checkLinearity(src){try{return {ok:true,p:normalizeLinearExpression(parseExpression(src))}}catch(e){return {ok:false,reason:e.message}}}
function splitConstraint(text){let m=text.match(/(<=|>=|≤|≥|=)/);if(!m)throw Error('Include =, ≤, or ≥ between two expressions.');return {left:text.slice(0,m.index).trim(),op:m[0].replace('<=','≤').replace('>=','≥'),right:text.slice(m.index+m[0].length).trim()}}
function normalizeConstraint(text){let s=splitConstraint(text),L=checkLinearity(s.left),R=checkLinearity(s.right);if(!L.ok)throw Error(L.reason);if(!R.ok)throw Error(R.reason);let a=L.p.a-R.p.a,b=L.p.b-R.p.b,c=R.p.c-L.p.c;if(Math.abs(a)<EPS&&Math.abs(b)<EPS)throw Error('After simplifying, this has no variable boundary. Try a constraint that describes a line.');return {raw:text,left:s.left,right:s.right,op:s.op,a,b,c}}
function deriveBoundary(q){return `${fmt(q.a)}x ${q.b<0?'−':'+'} ${fmt(Math.abs(q.b))}y = ${fmt(q.c)}`}
function classifyBoundary(q){if(Math.abs(q.b)<EPS)return'vertical';if(Math.abs(q.a)<EPS)return'horizontal';if(Math.abs(q.c)<EPS)return'origin';return'standard'}
function calculateIntercepts(q){return {x:q.a? q.c/q.a:null,y:q.b?q.c/q.b:null}}
function evaluateConstraintAtPoint(q,p){let v=q.a*p.x+q.b*p.y-q.c;return q.op==='='?Math.abs(v)<EPS:q.op==='≤'?v<=EPS:v>=-EPS}
function isPointOnBoundary(q,p){return Math.abs(q.a*p.x+q.b*p.y-q.c)<1e-6}
function parseNumber(s){let m=String(s).trim().match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:\/([+-]?(?:\d+(?:\.\d*)?|\.\d+)))?$/);if(!m)return NaN;return m[2]?+m[1]/+m[2]:+m[1]}
function equivalentBoundary(input,q){try{let z=normalizeConstraint(input.includes('=')?input:input+'=0');if(z.op!=='=')return false;let cross=q.a*z.b-q.b*z.a;return Math.abs(cross)<1e-6&&Math.abs(q.a*z.c-z.a*q.c)<1e-6&&Math.abs(q.b*z.c-z.b*q.c)<1e-6}catch{return false}}
function validSign(q){return q.op==='≤'?-1:q.op==='≥'?1:0}
function setStep(x){S.step=x;render()}
const stages=['variables','nonneg','constraint','linearity','boundary','plot','test','truth','side','final'];
function progress(){let i=Math.max(0,stages.indexOf(S.step));$('#stageLabel').textContent=`Step ${i+1} · ${({variables:'Variables',nonneg:'Nonnegativity',constraint:'Constraint',linearity:'Linearity',boundary:'Boundary',plot:'Plot',test:'Test point',truth:'True or false',side:'Valid side',final:'Feasible region'})[S.step]}`;$('#progress').innerHTML=stages.map((_,j)=>`<span class="pip ${j<=i?'on':''}"></span>`).join('')}
function why(title,text){return `<div class="why"><button type="button" onclick="this.nextElementSibling.classList.toggle('hidden')">Why? ${title}</button><p class="hidden">${text}</p></div>`}
function render(){progress();drawCoordinatePlane();renderList();let v=S.vars.map(esc);if(S.step==='variables')lesson.innerHTML=`<h2>What are your two variables?</h2><p class="lead">Give the quantities meaningful names. We’ll use those names in every explanation and on the graph.</p><div class="fields"><div class="field"><label for="v1">Variable 1</label><input id="v1" value="${v[0]==='x'?'':v[0]}" placeholder="e.g., Desks"></div><div class="field"><label for="v2">Variable 2</label><input id="v2" value="${v[1]==='y'?'':v[1]}" placeholder="e.g., Chairs"></div></div><div id="fb"></div><button class="btn" id="saveVars">Continue</button>`;
else if(S.step==='nonneg')lesson.innerHTML=`<h2>Are nonnegativity constraints included?</h2><p class="lead">Should the model include both of these requirements?</p><div class="note math">${v[0]} ≥ 0<br>${v[1]} ≥ 0</div><div class="choice"><button class="btn" data-nonneg="yes">Yes</button><button class="btn secondary" data-nonneg="no">No</button></div>${why('does this matter?','If both variables are nonnegative, negative coordinates cannot represent valid solutions. We can focus on the first quadrant.')}`;
else if(S.step==='constraint'){let defaultName=S.editing?S.editing.original.name||`Constraint ${S.editing.index+1}`:`Constraint ${S.constraints.length+1}`;lesson.innerHTML=`<h2>${S.editing?`Correct ${esc(defaultName)}`:(S.constraints.length?'Add another constraint':'Enter your first constraint')}</h2><p class="lead">${S.editing?'Revise the relation, then work through its graphing steps again.':'Write the complete relation. Variables may appear on either side.'}</p><div class="fields"><div class="field"><label for="constraintName">Constraint name</label><input id="constraintName" value="${esc(S.draft?.name||defaultName)}" placeholder="${esc(defaultName)}"></div><div class="field"><label for="constraint">Mathematical constraint</label><input id="constraint" placeholder="3 ${v[0]} + 2 ${v[1]} ≤ 120" value="${esc(S.draft?.raw||'')}"></div></div><p class="lead">You may type &lt;= or &gt;=. The app will display the proper ≤ or ≥ symbol.</p><div id="fb"></div><div class="button-row"><button class="btn" id="checkConstraint">${S.editing?'Check the correction':'Check the constraint'}</button>${S.editing?'<button class="btn secondary" id="cancelEdit">Cancel correction</button>':(S.constraints.length?'<button class="btn secondary" id="doneBtn">I’m done entering constraints</button>':'')}</div>`}
else if(S.step==='linearity')lesson.innerHTML=`<h2>Is it linear? 🎵</h2><p class="lead">Recall that a linear expression is a weighted sum of variables.</p><p class="song-intro">Remember the song!</p><div class="song">“Number, variable, number, variable, that’s what linear is all about!”</div><div class="note math">${prettyMath(S.draft.raw)}</div><p>Do you think this constraint is linear?</p><div class="choice"><button class="btn secondary" data-linear="yes">Yes</button><button class="btn secondary" data-linear="no">No</button><button class="btn secondary" data-linear="unsure">I’m not sure</button></div><div id="fb"></div>`;
else if(S.step==='boundary'){if(S.current.op==='=')lesson.innerHTML=`<h2>We already have an equation</h2><p class="lead">This constraint already uses equality, so let’s plot its corresponding straight line.</p><div class="note math">${prettyMath(S.current.raw)}</div><p>We still need two points that satisfy the equation before the line appears.</p><div class="button-row"><button class="btn" id="goPlotDirect">Find points for the line</button></div>`;else lesson.innerHTML=`<h2>Build the equation</h2><p class="lead">To graph an inequality, we first identify its straight-line equation.</p><div class="note math">${prettyMath(S.current.raw)}</div><div class="field"><label for="boundary">What should the equation be?</label><input id="boundary" placeholder="Replace the inequality with ="></div><div id="fb"></div><div class="button-row" id="boundaryActions"><button class="btn" id="checkBoundary">Check my equation</button></div>${why('replace the inequality with equality?','Points that satisfy the equation (=) are ON the line. The inequality will later tell us which region beside that line is valid.')}`}
else if(S.step==='plot')renderPlotLesson(v);
else if(S.step==='test')lesson.innerHTML=`<h2>Choose a test point</h2><p class="lead">The boundary divides the plane. Choose a point that is <b>not</b> on the boundary so we can identify a side.</p><div class="row"><div class="field"><label for="px">${v[0]} coordinate</label><input id="px" inputmode="decimal" value="${S.point?fmt(S.point.x):''}"></div><div class="field"><label for="py">${v[1]} coordinate</label><input id="py" inputmode="decimal" value="${S.point?fmt(S.point.y):''}"></div></div><p class="lead">Or click directly on the coordinate plane.</p><div id="fb"></div><button class="btn" id="usePoint">Use this point</button>${why('not on the line?','A boundary point satisfies the equality but gives no information about either side. A point away from the line belongs clearly to one half-plane.')}`;
else if(S.step==='truth')renderTruth(v);
else if(S.step==='side')renderSide(v);
else if(S.step==='final')renderFinal(v);bind()}
function renderPlotLesson(v){let q=S.current,t=classifyBoundary(q),I=calculateIntercepts(q);q.plotTask=null;if(t==='standard'&&(I.x<-EPS||I.y<-EPS)){let useY=I.x>=-EPS,unknown=useY?'x':'y',fixed=useY?'y':'x',base=useY?I.x:I.y,calc=n=>useY?(q.c-q.b*n)/q.a:(q.c-q.a*n)/q.b;q.plotTask={fixed,unknown,base,calc};let fn=fixed==='x'?v[0]:v[1],un=unknown==='x'?v[0]:v[1],negative=[];if(I.x<-EPS)negative.push(`${v[0]}-axis intercept ${fmt(I.x)}`);if(I.y<-EPS)negative.push(`${v[1]}-axis intercept ${fmt(I.y)}`);lesson.innerHTML=`<h2>Choose two more useful points</h2><div class="feedback try"><b>Observation:</b> the ${negative.join(' and the ')} is negative. That point may be outside the relevant viewing region.</div><p>Instead of relying on that negative intercept, choose your own nonzero value for ${fn}. Then calculate the corresponding value of ${un}.</p><div class="note math">${deriveBoundary(q).replaceAll('x',v[0]).replaceAll('y',v[1])}</div><div class="choice-point-grid"><div class="field anchor-field"><label>First point: when ${fn} = 0, what is ${un}?</label><input id="i1"></div><div class="field"><label for="chosenFixed">Your nonzero value for ${fn}</label><input id="chosenFixed" placeholder="Choose a value"></div><div class="field"><label for="i2">The corresponding value of ${un}</label><input id="i2"></div></div><div id="fb"></div><button class="btn" id="plotLine">Check and plot</button>${why('choose a nonzero value?','A negative intercept can fall outside the useful part of the graph. If a choice produces another negative coordinate, try a different value. Any two distinct points satisfying the equation determine the same straight line.')}`}
else if(t==='standard')lesson.innerHTML=`<h2>Find two intercepts</h2><p>To draw a line, we need two points. Axis intercepts often give us two convenient points.</p><div class="note math">${deriveBoundary(q).replaceAll('x',v[0]).replaceAll('y',v[1])}</div><div class="row"><div class="field"><label>Set ${v[1]} = 0. What is ${v[0]}?</label><input id="i1"></div><div class="field"><label>Set ${v[0]} = 0. What is ${v[1]}?</label><input id="i2"></div></div><div id="fb"></div><button class="btn" id="plotLine">Check and plot</button>${why('do we need two points?','Exactly one straight line passes through two distinct points.')}`;
else if(t==='origin'){let choose=Math.abs(q.b)>EPS?2:0;lesson.innerHTML=`<h2>This line passes through the origin</h2><p>Both intercepts give the same point: <b>(0, 0)</b>. One point is not enough, so we need another.</p><div class="note">Let’s choose ${v[0]} = ${choose}. What must ${v[1]} be?</div><div class="field"><label for="second">${v[1]} coordinate</label><input id="second"></div><div id="fb"></div><button class="btn" id="plotOrigin">Check and plot</button>`}
else lesson.innerHTML=`<h2>A ${t} boundary</h2><p>${t==='vertical'?`Every point has the same ${v[0]} value.`:`Every point has the same ${v[1]} value.`} This is a case where intercept calculations would be awkward.</p><div class="note math">${deriveBoundary(q).replaceAll('x',v[0]).replaceAll('y',v[1])}</div><button class="btn" id="plotSpecial">Plot the boundary</button>`}
function substitution(q,p){let L=checkLinearity(splitConstraint(q.raw).left).p,R=checkLinearity(splitConstraint(q.raw).right).p;let lv=L.a*p.x+L.b*p.y+L.c,rv=R.a*p.x+R.b*p.y+R.c;return `${fmt(L.a)}(${fmt(p.x)}) + ${fmt(L.b)}(${fmt(p.y)}) + ${fmt(L.c)} ${q.op} ${fmt(R.a)}(${fmt(p.x)}) + ${fmt(R.b)}(${fmt(p.y)}) + ${fmt(R.c)}<br><b>${fmt(lv)} ${q.op} ${fmt(rv)}</b>`}
function renderTruth(v){let q=S.current;lesson.innerHTML=`<h2>Is this statement true or false?</h2><p>Substitute <b>(${fmt(S.point.x)}, ${fmt(S.point.y)})</b> into the original constraint:</p><div class="note math">${substitution(q,S.point)}</div><div class="choice"><button class="btn secondary" data-truth="true">TRUE</button><button class="btn secondary" data-truth="false">FALSE</button></div><div id="fb"></div>`}
function renderSide(v){finishConstraint()}
function renderFinal(v){let geo=calculateFeasibleRegion();let desc=geo.kind==='empty'?'No feasible region exists.':geo.kind==='area'?(geo.unbounded?'The feasible region is unbounded.':'The feasible region is bounded.'):geo.kind==='point'?'The feasible set is a single point.':'The feasible set is a line or line segment.';lesson.innerHTML=`<h2>${geo.kind==='empty'?'No feasible region exists':'Here is the feasible region'}</h2><p class="lead">${desc}</p>${geo.unbounded?'<div class="note">The region continues beyond the visible graph. The edge of the graph is not a mathematical boundary.</div>':''}<button class="btn" id="newProblem">Start a new problem</button>`}
function bind(){let el=id=>document.getElementById(id);if(el('cancelEdit'))el('cancelEdit').onclick=cancelConstraintEdit;if(el('goPlotDirect'))el('goPlotDirect').onclick=()=>{adaptRange(S.current);setStep('plot')};if(el('saveVars'))el('saveVars').onclick=()=>{let a=el('v1').value.trim(),b=el('v2').value.trim();if(!a||!b)return fb('Both variables need a name.','try');if(a.toLowerCase()===b.toLowerCase())return fb('Choose two different names so we can tell the axes apart.','try');if(!/^[A-Za-z][A-Za-z ]*$/.test(a+b))return fb('Use letters and spaces for variable names.','try');S.vars=[a,b];setStep('nonneg')};document.querySelectorAll('[data-nonneg]').forEach(b=>b.onclick=()=>{S.nonneg=b.dataset.nonneg==='yes';S.range=S.nonneg?{xmin:0,xmax:10,ymin:0,ymax:10}:{xmin:-10,xmax:10,ymin:-10,ymax:10};setStep('constraint')});if(el('checkConstraint'))el('checkConstraint').onclick=()=>{let raw=el('constraint').value.trim(),fallback=S.editing?`Constraint ${S.editing.index+1}`:`Constraint ${S.constraints.length+1}`,name=el('constraintName').value.trim()||fallback;try{let rel=splitConstraint(raw),L=checkLinearity(rel.left),R=checkLinearity(rel.right),analysis={ok:L.ok&&R.ok,reason:!L.ok?L.reason:!R.ok?R.reason:''};S.draft={raw,name,analysis};if(analysis.ok)Object.assign(S.draft,normalizeConstraint(raw));setStep('linearity')}catch(e){fb(e.message,'try')}};if(el('doneBtn'))el('doneBtn').onclick=()=>setStep('final');document.querySelectorAll('[data-linear]').forEach(b=>b.onclick=()=>{let actual=S.draft.analysis?.ok!==false,ans=b.dataset.linear;if(!actual){let opening=ans==='no'?'Exactly—this constraint is not linear.':ans==='unsure'?'Good choice to pause and inspect it. This constraint is not linear.':'Not quite—this constraint is not linear.';fb(`${opening} ${S.draft.analysis.reason}` ,ans==='no'?'good':'try',`<button class="btn small" id="reviseConstraint">Revise the constraint</button>`);setTimeout(()=>{let z=el('reviseConstraint');if(z)z.onclick=()=>setStep('constraint')},0);return}if(ans==='yes'){fb('Exactly. Each variable has only a numerical weight; we are adding weighted variables.','good',`<button class="btn small" id="goBoundary">Continue</button>`);setTimeout(()=>{let z=el('goBoundary');if(z)z.onclick=()=>{S.current=S.draft;setStep('boundary')}},0)}else fb(ans==='unsure'?'Look for the pattern: numbers multiply variables, and the pieces are added. This one is linear.':'Take another look: no variables multiply each other, appear in denominators, or have powers. This one is linear.','try')});if(el('checkBoundary'))el('checkBoundary').onclick=()=>{if(equivalentBoundary(el('boundary').value,S.current)){adaptRange(S.current);fb('Nice. That equation describes exactly the same boundary line.','good',`<button class="btn small" id="goPlot">Continue</button>`);setTimeout(()=>el('goPlot').onclick=()=>setStep('plot'),0)}else fb('Not quite. Replace the comparison with equality while keeping the same dividing line. Equivalent rearrangements are welcome.','try')};if(el('plotLine'))el('plotLine').onclick=()=>{let task=S.current.plotTask,a=parseNumber(el('i1').value),b=parseNumber(el('i2').value);if(task){let chosen=parseNumber(el('chosenFixed').value),expected=task.calc(chosen),fn=task.fixed==='x'?S.vars[0]:S.vars[1],un=task.unknown==='x'?S.vars[0]:S.vars[1];if(!Number.isFinite(chosen)||Math.abs(chosen)<EPS)return fb(`Choose a nonzero value for ${fn} first.`,'try');if(expected<-EPS)return fb(`Observation: choosing ${fn} = ${fmt(chosen)} makes ${un} = ${fmt(expected)}, which is negative again. Choose a different nonzero value and recalculate ${un}.`,'try');if(Math.abs(a-task.base)>=1e-5)return fb(`Recheck the first point. When ${fn} = 0, the equation gives ${un} = ${fmt(task.base)}, not ${fmt(a)}.`,'try');if(Math.abs(b-expected)>=1e-5)return fb(`Your chosen value is fine. Substitute ${fn} = ${fmt(chosen)} into the equation again; the corresponding value is not ${fmt(b)}.`,'try');S.current.points=task.fixed==='x'?[{x:0,y:task.base},{x:chosen,y:expected} function screenToMath(e){let box=svg.getBoundingClientRect(),r=S.range,pad=46,W=760,H=640,px=(e.clientX-box.left)/box.width*W,py=(e.clientY-box.top)/box.height*H;return{x:r.xmin+(px-pad)/(W-2*pad)*(r.xmax-r.xmin),y:r.ymax-(py-pad)/(H-2*pad)*(r.ymax-r.ymin)}}
function lineSegment(q,r){if(q===S.current&&!['test','truth','side'].includes(S.step))return null;let P=[],add=(x,y)=>{if(x>=r.xmin-EPS&&x<=r.xmax+EPS&&y>=r.ymin-EPS&&y<=r.ymax+EPS&&!P.some(p=>Math.hypot(p.x-x,p.y-y)<EPS))P.push({x,y})};if(Math.abs(q.b)>EPS){add(r.xmin,(q.c-q.a*r.xmin)/q.b);add(r.xmax,(q.c-q.a*r.xmax)/q.b)}if(Math.abs(q.a)>EPS){add((q.c-q.b*r.ymin)/q.a,r.ymin);add((q.c-q.b*r.ymax)/q.a,r.ymax)}return P.length>=2?[P[0],P[1]]:null}

function clip(poly,q,op=q.op){let out=[];for(let i=0;i<poly.length;i++){let A=poly[i],B=poly[(i+1)%poly.length],ia=inside({...q,op},A),ib=inside({...q,op},B);if(ia)out.push(A);if(ia!==ib){let dx=B.x-A.x,dy=B.y-A.y,t=(q.c-q.a*A.x-q.b*A.y)/(q.a*dx+q.b*dy);out.push({x:A.x+t*dx,y:A.y+t*dy})}}return out}

function fitFeasibleRegion(){let g=calculateFeasibleRegion();if(g.kind==='empty'||g.unbounded)return;let pts=g.kind==='area'?g.poly:g.points;if(!pts?.length)return;let xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),dx=xmax-xmin,dy=ymax-ymin,cx=(xmin+xmax)/2,cy=(ymin+ymax)/2,plotW=668,plotH=548,unitsPerPixel=Math.max(dx/plotW,dy/plotH,2/plotH),xspan=unitsPerPixel*plotW*1.28,yspan=unitsPerPixel*plotH*1.28,nxmin=cx-xspan/2,nxmax=cx+xspan/2,nymin=cy-yspan/2,nymax=cy+yspan/2;if(S.nonneg&&nxmin<0){nxmax-=nxmin;nxmin=0}if(S.nonneg&&nymin<0){nymax-=nymin;nymin=0}S.range={xmin:nxmin,xmax:nxmax,ymin:nymin,ymax:nymax}}

function renderList(){$('#constraintList').innerHTML=S.constraints.map((q,i)=>`<div class="constraint-chip"><span class="dot" style="--c:${COLORS[i%COLORS.length]}"></span><span>${esc(q.name||`Constraint ${i+1}`)}</span><span class="math">${prettyMath(q.raw)}</span><button class="chip-edit" type="button" onclick="editConstraint(${i})" aria-label="Edit ${esc(q.name||`Constraint ${i+1}`)}">Edit</button></div>`).join('')}
function editConstraint(index){if(S.editing)return;let original=S.constraints.splice(index,1)[0];S.editing={index,original};S.draft={raw:original.raw,name:original.name};S.current=null;S.point=null;S.final=false;setStep('constraint')}

function reset(){if((S.constraints.length||S.step!=='variables')&&!confirm('Start over and clear this problem?'))return;Object.assign(S,{step:'variables',vars:['x','y'],nonneg:null,constraints:[],draft:null,current:null,editing:null,tries:{},range:{xmin:-10,xmax:10,ymin:-10,ymax:10},point:null,final:false});render()}
